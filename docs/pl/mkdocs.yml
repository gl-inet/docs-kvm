repo_name: gl-inet/docs-kvm
repo_url: https://github.com/gl-inet/docs-kvm
edit_uri: ""

site_name: Dokumentacja GL.iNet KVM
site_description: Dokumentacja produktów GL.iNet KVM
site_author: GL.iNet
site_url: https://docs.gl-inet.com/kvm/pl/
site_dir: site
copyright: Copyright &copy; 2026 GL Technologies & Microuter Technologies

theme:
  name: material
  language: pl
  logo: https://static.gl-inet.com/docs/router/common/logo_white.svg
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.top
  favicon: https://static.gl-inet.com/docs/router/common/favicon.png

plugins:
  - search
  - git-revision-date-localized
  - redirects:
      redirect_maps:
        "faq/what_devices_can_glinet_kvm_control.md": "faq/quick_faqs_about_glinet_kvm.md"
        "faq/frequently_askedquestions_about_glinet_kvm.md": "faq/quick_faqs_about_glinet_kvm.md"
        "faq/power_on_off_control.md": "faq/quick_faqs_about_glinet_kvm.md"
        "faq/does_glkvm_application_support_chromeos_or_linux.md": "faq/quick_faqs_about_glinet_kvm.md"
        "faq/can_comet_connect_to_wireless_network.md": "faq/quick_faqs_about_glinet_kvm.md"
        "faq/cannot_hear_the_audio_from_the_controlled_device.md": "faq/no_audio_from_the_controlled_device.md"
        "faq/can_only_see_desktop_wallpaper_when_using_glkvm.md": "faq/remote_screen_only_displays_desktop_wallpaper.md"
        "faq/only_desktop_wallpaper_displayed_in_glkvm.md": "faq/remote_screen_only_displays_desktop_wallpaper.md"
        "faq/mouse_cursors_fail_to_overlap_when_using_glkvm.md": "faq/mouse_cursors_fail_to_align.md"
        "user_guide/gl-rm1/control_panel_guide.md": "user_guide/gl-rm1/console_guide.md"
        "user_guide/gl-rm1pe/control_panel_guide.md": "user_guide/gl-rm1pe/console_guide.md"
        "user_guide/gl-rm10/control_panel_guide.md": "user_guide/gl-rm10/console_guide.md"
        "user_guide/gl-rm10rc/control_panel_guide.md": "user_guide/gl-rm10rc/console_guide.md"
        "faq/local_access_to_controlled_device_via_browser.md": "faq/local_access_via_browser.md"
        "faq/remote_access_to_controlled_device_via_cloud.md": "faq/remote_access_via_cloud.md"
        "faq/remote_access_to_controlled_device_via_glkvm_app.md": "faq/remote_access_via_glkvm_app.md"
        "faq/remote_access_to_controlled_device_via_tailscale.md": "faq/remote_access_via_tailscale.md"
        "faq/remote_access_to_controlled_device_via_zerotier.md": "faq/remote_access_via_zerotier.md"
        "faq/connect_usb_ttl.md": "tutorials/how_to_access_serial_console_via_usb_ttl.md"
        "faq/how_to_record_screen.md": "tutorials/how_to_record_remote_screen.md"
        "faq/disable_ping_icmp.md": "tutorials/how_to_disable_ping_icmp_packets.md"
        "faq/configure_reduce_stun_detection.md": "tutorials/how_to_reduce_stun_public_ip_detection_frequency.md"
        "faq/how_to_set_edid_for_glkvm.md": "tutorials/how_to_set_edid_for_glkvm.md"
        "faq/display_blank_screen_when_using_glkvm.md": "faq/remote_screen_goes_blank_no_hdmi_signal.md"
        "faq/bios_does_not_display_in_glkvm.md": "faq/remote_screen_does_not_show_bios_interface.md"
        "faq/cannot_control_the_mouse.md": "faq/cannot_control_mouse_and_keyboard.md"
        "faq/how_to_fix_mouse_latency_when_rpi4_controls_rpi3_via_glkvm.md": "faq/fix_mouse_latency_when_rpi4_controls_rpi3_via_kvm.md"

hooks:
  - ../../scripts/alternate_links.py

extra:
  analytics:
    feedback:
      title: Czy ta strona była pomocna?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Ta strona była pomocna
          data: 1
          note: Dziękujemy za opinię!
        - icon: material/emoticon-sad-outline
          name: Ta strona wymaga ulepszeń
          data: 0
          note: >-
            Dziękujemy za opinię! Pomóż nam ulepszyć tę stronę,
            <a href="https://glinet.feishu.cn/share/base/form/shrcnbojSI6bg5XpcptdEzhQjpc"
            data-prefill="Which page needs improvement?" target="_blank" rel="noopener">informując nas,
            czego na niej brakuje</a>.
  social:
    - icon: fontawesome/solid/globe
      link: https://www.gl-inet.com
    - icon: fontawesome/brands/github
      link: https://github.com/gl-inet/
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/gl.inet.wifi/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/GLiNetWiFi
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/gl-inet.com/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCBfNEzurltlIeFFCbUgHQyg
    - icon: fontawesome/brands/pinterest
      link: https://www.pinterest.com/glinetWiFi/
  alternate:
    - name: English
      link: /kvm/en/
      lang: en
    - name: Deutsch
      link: /kvm/de/
      lang: de
    - name: 日本語
      link: /kvm/ja/
      lang: ja
    - name: Español
      link: /kvm/es/
      lang: es
    - name: Français
      link: /kvm/fr/
      lang: fr
    - name: Italiano
      link: /kvm/it/
      lang: it
    - name: Polski
      link: /kvm/pl/
      lang: pl

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.1/photoswipe.min.css
  - https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.1/default-skin/default-skin.min.css
  - https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.0.1/dist/cookieconsent.css
  - stylesheets/extra.css
  - stylesheets/docs-footer.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.1/photoswipe.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.1/photoswipe-ui-default.min.js
  - https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.0.1/dist/cookieconsent.umd.js
  - javascripts/analytics.js
  - javascripts/extra.js
  - javascripts/cookieconsent.js

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
  - admonition

nav:
  - Strona główna: index.md
  - Instrukcja obsługi:
      - Przegląd: user_guide/index.md
      - GL-RM1/GL-RM1V2 (Comet):
          - Instrukcja obsługi Comet: user_guide/gl-rm1/index.md
          - Opis produktu: user_guide/gl-rm1/product_overview.md
          - Szybka konfiguracja: user_guide/gl-rm1/quick_setup_guide.md
          - Przewodnik po konsoli: user_guide/gl-rm1/console_guide.md
      - GL-RM1PE (Comet PoE):
          - Instrukcja obsługi Comet PoE: user_guide/gl-rm1pe/index.md
          - Opis produktu: user_guide/gl-rm1pe/product_overview.md
          - Szybka konfiguracja: user_guide/gl-rm1pe/quick_setup_guide.md
          - Przewodnik po konsoli: user_guide/gl-rm1pe/console_guide.md
      - GL-RM10 (Comet Pro):
          - Instrukcja obsługi Comet Pro: user_guide/gl-rm10/index.md
          - Opis produktu: user_guide/gl-rm10/product_overview.md
          - Szybka konfiguracja: user_guide/gl-rm10/quick_setup_guide.md
          - Przewodnik po konsoli: user_guide/gl-rm10/console_guide.md
      - GL-RM10RC (Comet 5G):
          - Instrukcja obsługi Comet 5G: user_guide/gl-rm10rc/index.md
          - Opis produktu: user_guide/gl-rm10rc/product_overview.md
          - Szybka konfiguracja: user_guide/gl-rm10rc/quick_setup_guide.md
          - Przewodnik po konsoli: user_guide/gl-rm10rc/console_guide.md
      - GL-RMQ1 (Comet Q):
          - Instrukcja obsługi Comet Q: user_guide/gl-rmq1/index.md
          - Opis produktu: user_guide/gl-rmq1/product_overview.md
          - Szybka konfiguracja: user_guide/gl-rmq1/quick_setup_guide.md
          - Przewodnik po konsoli: user_guide/gl-rmq1/console_guide.md
          - Najczęstsze pytania o Comet Q: user_guide/gl-rmq1/faqs.md
      - GL-RM4PE (Comet X):
          - Instrukcja obsługi Comet X: user_guide/gl-rm4pe/index.md
          - Opis produktu: user_guide/gl-rm4pe/product_overview.md
          - Szybka konfiguracja: user_guide/gl-rm4pe/quick_setup_guide.md
          - Przewodnik po konsoli: user_guide/gl-rm4pe/console_guide.md
      - GL-ATXPC (ATX Board): user_guide/gl-atx-board/index.md
      - GL-FGB-01 (Fingerbot): user_guide/gl-fgb-01/index.md
  - Najczęstsze pytania:
      - Przegląd: faq/index.md
      - Pierwsze kroki:
          - Podstawowe pytania o GL.iNet KVM: faq/quick_faqs_about_glinet_kvm.md
          - Aktualizacja firmware: faq/firmware_upgrade.md
          - Pobieranie aplikacji GLKVM: faq/glkvm_app.md
          - Wykrywanie sieci WAN i przełączanie awaryjne w Comet 5G: faq/wan_network_detection_and_failover_logic_of_comet5g.md
      - Dostęp lokalny i zdalny:
          - Dostęp lokalny przez przeglądarkę: faq/local_access_via_browser.md
          - Dostęp zdalny przez chmurę: faq/remote_access_via_cloud.md
          - Dostęp zdalny przez aplikację GLKVM: faq/remote_access_via_glkvm_app.md
          - Dostęp zdalny przez Tailscale: faq/remote_access_via_tailscale.md
          - Dostęp zdalny przez ZeroTier: faq/remote_access_via_zerotier.md
          - Dostęp zdalny przez NetBird: faq/remote_access_via_netbird.md
          - Błąd prywatności w przeglądarce: faq/privacy_error_from_your_browser.md
      - Usługa chmurowa:
          - Powiązanie za pomocą kodu: tutorials/how_to_bind_kvm_to_the_cloud_via_dynamic_code.md
          - Plan usługi KVM Cloud: faq/which_kvm_cloud_service_plan_is_right_for_you.md
          - Udostępnianie urządzeń KVM: tutorials/how_to_share_kvm_devices_with_others.md
          - Odłączanie KVM od konta: faq/unbind.md
          - Wyłączanie usługi chmurowej: faq/disable_cloud.md
          - Usuwanie konta chmurowego: faq/delete_cloud_account.md
      - Problemy z zasilaniem urządzenia:
          - Urządzenie nie włącza się: faq/power_cable_connected_but_device_unpowered.md
          - Urządzenie jest niesprawne: faq/debrick.md
      - Problemy z aplikacją GLKVM:
          - Nie można znaleźć urządzenia: faq/no_device_is_found_in_the_glkvm_app.md
          - Nie można powiązać urządzenia: faq/failed_to_bind_device_to_glkvm_app.md
          - Nie można połączyć się z urządzeniem: faq/connection_failed_when_remote_access_via_glkvm_app.md
          - Nie można zainstalować GLKVM w Windows: faq/failed_to_install_glkvm_app_the_code_execution_cannot_proceed.md
      - Problemy z obrazem:
          - Zdalny ekran wyświetla tylko tapetę pulpitu: faq/remote_screen_only_displays_desktop_wallpaper.md
          - Zdalny ekran jest pusty lub brak sygnału HDMI: faq/remote_screen_goes_blank_no_hdmi_signal.md
          - Zdalny ekran nie wyświetla interfejsu BIOS: faq/remote_screen_does_not_show_bios_interface.md
      - Problemy z klawiaturą i myszą:
          - Nie można sterować myszą i klawiaturą: faq/cannot_control_mouse_and_keyboard.md
          - Kursory myszy nie pokrywają się: faq/mouse_cursors_fail_to_align.md
          - Klawiatura działa niezgodnie z oczekiwaniami: faq/keyboard_does_not_input_output_as_expected.md
          - Mysz w trybie względnym nie działa z Reolink NVR: faq/relative_mouse_not_working_on_reolink_nvr.md
          - Różnica między bezwzględnym i względnym trybem myszy: faq/difference_between_absolute_and_relative_mouse.md
          - Opóźnienia myszy podczas sterowania RPi3 z RPi4 przez KVM: faq/fix_mouse_latency_when_rpi4_controls_rpi3_via_kvm.md
      - Problemy z dźwiękiem:
          - Brak dźwięku ze sterowanego urządzenia: faq/no_audio_from_the_controlled_device.md
          - Ustawienia głośnika i mikrofonu nie są zapisywane: faq/speaker_microphone_settings_cannot_be_retained.md
  - Poradniki:
      - Przegląd: tutorials/index.md
      - Sieć i system:
          - Jak ustawić statyczny adres IP dla KVM: tutorials/how_to_set_static_ip_for_comet.md
          - Jak zmienić nazwę hosta KVM: tutorials/how_to_change_kvm_hostname.md
          - Jak zmienić tożsamość urządzenia KVM: tutorials/how_to_change_device_identity.md
          - Jak ustawić EDID w KVM: tutorials/how_to_set_edid_for_glkvm.md
          - Jak przechwycić tekst ze zdalnego ekranu: tutorials/how_to_capture_text_from_remote_screen.md
          - Jak sprawdzić obsługę DP Alt Mode w porcie USB-C: tutorials/how_to_check_usb-c_port_dp_alt_mode.md
          - Jak wyłączyć wysyłanie pakietów PING/ICMP z KVM: tutorials/how_to_disable_ping_icmp_packets.md
          - Jak zmniejszyć częstotliwość wykrywania publicznego IP przez STUN: tutorials/how_to_reduce_stun_public_ip_detection_frequency.md
      - Usługa chmurowa:
          - Jak powiązać KVM z chmurą za pomocą kodu dynamicznego: tutorials/how_to_bind_kvm_to_the_cloud_via_dynamic_code.md
          - Jak korzystać ze ściany ekranów w chmurze: tutorials/how_to_use_screen_wall.md
          - Jak udostępniać urządzenia KVM innym osobom: tutorials/how_to_share_kvm_devices_with_others.md
      - Nośniki wirtualne:
          - Jak udostępniać pliki przez KVM: tutorials/how_to_share_files_between_controlling_device_and_controlled_device.md
          - Jak zdalnie zainstalować system operacyjny: tutorials/how_to_install_os_remotely.md
          - Jak nagrać zdalny ekran: tutorials/how_to_record_remote_screen.md
      - Centrum aplikacji:
          - Jak uzyskać zdalny dostęp do KVM przez Tailscale: faq/remote_access_via_tailscale.md
          - Jak uzyskać zdalny dostęp do KVM przez ZeroTier: faq/remote_access_via_zerotier.md
          - Jak uzyskać zdalny dostęp do KVM przez NetBird: faq/remote_access_via_netbird.md
      - Rozwiązywanie problemów:
          - Jak przywrócić działanie KVM przez U-Boot: faq/debrick.md
          - Jak przywrócić działanie KVM za pomocą RKDevTool: tutorials/how_to_debrick_kvm_via_rkdevtool.md
          - Jak przywrócić działanie KVM przez USB OTG: tutorials/how_to_unbrick_kvm_via_usb_otg.md
          - Jak wyeksportować logi urządzenia i aplikacji: tutorials/how_to_export_device_and_app_logs.md
          - Jak wyeksportować logi sieci komórkowej: tutorials/how_to_export_cellular_logs.md
          - Jak usunąć opóźnienia myszy przy sterowaniu RPi3 z RPi4: tutorials/how_to_fix_mouse_latency_when_rpi4_controls_rpi3_via_glkvm.md
      - Sprzęt i USB:
          - Jak uzyskać dostęp do konsoli szeregowej przez USB TTL: tutorials/how_to_access_serial_console_via_usb_ttl.md
  - Biblioteka filmów:
      - Przegląd: video_library/index.md
      - Poznaj nasze produkty: video_library/products.md
      - Rozpakowanie i pierwsza konfiguracja: video_library/unboxing_first_set_up.md
      - Funkcje: video_library/features.md
  - Nowości w firmware:
      - Przegląd: features_update/index.md
      - Firmware v1.10: features_update/firmware_v1.10.md
      - Firmware v1.9: features_update/firmware_v1.9.md
