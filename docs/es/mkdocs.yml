          - Guía de la consola: user_guide/gl-rm10rc/console_guide.md
      - GL-RMQ1 (Comet Q):
          - Guía del usuario de Comet Q: user_guide/gl-rmq1/index.md
          - Descripción del producto: user_guide/gl-rmq1/product_overview.md
          - Configuración rápida: user_guide/gl-rmq1/quick_setup_guide.md
          - Guía de la consola: user_guide/gl-rmq1/console_guide.md
          - Preguntas frecuentes sobre Comet Q: user_guide/gl-rmq1/faqs.md
      - GL-RM4PE (Comet X):
          - Guía del usuario de Comet X: user_guide/gl-rm4pe/index.md
          - Descripción del producto: user_guide/gl-rm4pe/product_overview.md
          - Configuración rápida: user_guide/gl-rm4pe/quick_setup_guide.md
          - Guía de la consola: user_guide/gl-rm4pe/console_guide.md
      - GL-ATXPC (placa ATX): user_guide/gl-atx-board/index.md
      - GL-FGB-01 (Fingerbot): user_guide/gl-fgb-01/index.md
  - Preguntas frecuentes:
      - Descripción general: faq/index.md
      - Primeros pasos:
          - Preguntas frecuentes básicas sobre GL.iNet KVM: faq/quick_faqs_about_glinet_kvm.md
          - Actualización del firmware: faq/firmware_upgrade.md
          - Descargar la aplicación GLKVM: faq/glkvm_app.md
          - Detección de red WAN y conmutación por error de Comet 5G: faq/wan_network_detection_and_failover_logic_of_comet5g.md
      - Acceso local y remoto:
          - Acceso local mediante el navegador: faq/local_access_via_browser.md
          - Acceso remoto mediante la nube: faq/remote_access_via_cloud.md
          - Acceso remoto mediante la aplicación GLKVM: faq/remote_access_via_glkvm_app.md
          - Acceso remoto mediante Tailscale: faq/remote_access_via_tailscale.md
