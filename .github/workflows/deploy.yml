name: Deploy Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docs-kvm-build-deploy
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      langs_json: ${{ steps.langs.outputs.json }}
    steps:
      - name: Define document languages
        id: langs
        run: |
          echo 'json=["en"]' >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.prepare.outputs.langs_json) }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.4"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build ${{ matrix.lang }} MkDocs site
        working-directory: docs/${{ matrix.lang }}
        run: mkdocs build --site-dir ../../site/${{ matrix.lang }}

      - name: Upload ${{ matrix.lang }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.lang }}
          path: site/${{ matrix.lang }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download built site artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: site

      - name: Checkout target repo (docs-build)
        uses: actions/checkout@v4
        with:
          repository: gl-inet/docs-build
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          path: docs-build

      - name: Deploy built docs to docs-build
        run: |
          for lang in ${{ join(fromJSON(needs.prepare.outputs.langs_json), ' ') }}; do
            rm -rf docs-build/kvm/$lang
            mkdir -p docs-build/kvm/$lang
            cp -r site/site-$lang/. docs-build/kvm/$lang/
          done

      - name: Commit and push to docs-build
        working-directory: docs-build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A kvm/
          git diff --cached --quiet || git commit -m "docs(kvm): update from gl-inet/docs-kvm@${{ github.sha }}"
          git push
